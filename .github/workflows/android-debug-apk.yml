name: Android Debug APK

# Build an installable debug APK in the cloud — no local computer needed.
# Run it from the GitHub website: Actions -> "Android Debug APK" -> Run workflow.
#
# The Android app is a Capacitor shell that loads the deployed production site
# (see capacitor.config.ts -> server.url), so this workflow does NOT need to build
# the web app. Capacitor's generated Android metadata is committed; CI only installs
# the native modules Gradle references and validates those committed files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "android-www/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 requires Node >=22, including during npm dependency install.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The app's own package.json pins a private build-cache registry through
      # bun.lock/bunfig.toml and pulls in the whole web toolchain, none of which CI
      # needs. Swap in a minimal, public-registry-only manifest for the native build.
      - name: Prepare Capacitor-only manifest
        run: |
          set -euxo pipefail
          mv package.json package.json.app
          rm -f bunfig.toml bun.lock bun.lockb package-lock.json
          cat > package.json <<'JSON'
          {
            "name": "koupl-android-ci",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "8.5.1",
              "@capacitor/android": "8.5.1",
              "@capacitor/app": "8.1.1",
              "@capacitor/keyboard": "8.0.5",
              "@capacitor/splash-screen": "8.0.2",
              "@capacitor/status-bar": "8.0.3"
            }
          }
          JSON
          npm install --no-audit --no-fund --registry=https://registry.npmjs.org

      # Capacitor's generated android/app/capacitor.build.gradle targets Java 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check native project is present
        run: |
          set -eux
          test -f capacitor.config.ts
          test -f android-www/index.html
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/src/main/assets/capacitor.config.json
          test -f android/app/src/main/assets/capacitor.plugins.json
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/res/xml/config.xml
          # settings.gradle includes this module; scaffold it if the checkout lacks it.
          mkdir -p android/capacitor-cordova-android-plugins/src/main/java \
                   android/capacitor-cordova-android-plugins/src/main/res
          ls -la android/capacitor-cordova-android-plugins

      - name: Validate committed Capacitor Android project
        run: |
          set -euxo pipefail
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8"));
            const plugins = JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.plugins.json", "utf8"));
            const expected = ["@capacitor/app", "@capacitor/keyboard", "@capacitor/splash-screen", "@capacitor/status-bar"];
            if (config.appId !== "com.koupl.app") throw new Error(`Unexpected appId: ${config.appId}`);
            if (config.server?.url !== "https://koupl-connect-play.lovable.app") throw new Error(`Unexpected server URL: ${config.server?.url}`);
            const actual = plugins.map(({ pkg }) => pkg).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected.sort())) throw new Error(`Unexpected plugins: ${actual.join(", ")}`);
            for (const pkg of ["@capacitor/android", ...expected]) {
              if (!fs.existsSync(`node_modules/${pkg}`)) throw new Error(`Missing native module: ${pkg}`);
            }
          '

      - name: Restore app manifest
        if: always()
        run: mv -f package.json.app package.json

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koupl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
