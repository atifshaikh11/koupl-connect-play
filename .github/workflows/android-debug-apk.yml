name: Android Debug APK

# Build an installable debug APK in the cloud — no local computer needed.
# Run it from the GitHub website: Actions -> "Android Debug APK" -> Run workflow.
#
# The Android app is a Capacitor shell that loads the deployed production site
# (see capacitor.config.ts -> server.url), so this workflow does NOT need to build
# the web app. It only needs the Capacitor CLI + plugins to sync the native project.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "android-www/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Installed explicitly from the public npm registry: the committed bun.lock
      # pins an internal build-cache registry that CI cannot reach.
      - name: Install Capacitor tooling
        run: |
          npm install --no-save --no-package-lock --registry=https://registry.npmjs.org \
            typescript@5 \
            @capacitor/cli@8 \
            @capacitor/core@8 \
            @capacitor/android@8 \
            @capacitor/app@8 \
            @capacitor/keyboard@8 \
            @capacitor/splash-screen@8 \
            @capacitor/status-bar@8

      # Capacitor's generated android/app/capacitor.build.gradle targets Java 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koupl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
